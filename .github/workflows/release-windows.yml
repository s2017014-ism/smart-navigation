name: Windows-only release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (for example, v1.4.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build local backend
        run: |
          python -m pip install pyinstaller fastapi httpx networkx pydantic shapely tzdata uvicorn
          python -m PyInstaller --noconfirm desktop_backend.spec
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-windows
      - name: Build Windows app
        working-directory: frontend
        run: flutter build windows --release
      - name: Bundle local backend with Windows app
        shell: pwsh
        run: |
          Copy-Item -Path dist/smart-navigation-backend/* `
            -Destination frontend/build/windows/x64/runner/Release -Recurse -Force
      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* `
            -DestinationPath smart-navigation-windows-x64.zip
      - name: Publish Windows-only release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$env:RELEASE_TAG" smart-navigation-windows-x64.zip `
            --target "$env:GITHUB_SHA" --title "$env:RELEASE_TAG" --generate-notes
