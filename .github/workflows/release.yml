name: Build and release apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-windows
      - name: Build Windows app
        working-directory: frontend
        run: flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path frontend/build/windows/x64/runner/Release/* `
            -DestinationPath smart-navigation-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: smart-navigation-windows-x64.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-linux
      - name: Build Linux app
        working-directory: frontend
        run: flutter build linux --release
      - name: Package Linux app
        run: |
          tar -czf smart-navigation-linux-x64.tar.gz \
            -C frontend/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: smart-navigation-linux-x64.tar.gz

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-macos-intel
      - name: Build Intel macOS app
        working-directory: frontend
        run: flutter build macos --release
      - name: Package Intel macOS app
        shell: bash
        run: |
          app_path="$(find frontend/build/macos/Build/Products/Release \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            smart-navigation-macos-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: smart-navigation-macos-x86_64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android
      - name: Build Android APK
        working-directory: frontend
        run: flutter build apk --release
      - name: Rename Android APK
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
            smart-navigation-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: smart-navigation-android.apk

  android-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-android-x86_64
      - name: Build Android x86_64 APK
        working-directory: frontend
        run: flutter build apk --release --target-platform android-x64
      - name: Rename Android x86_64 APK
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk \
            smart-navigation-android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-x86_64-release
          path: smart-navigation-android-x86_64.apk

  release:
    needs: [windows, linux, macos, android, android-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Start the backend before using route planning. When it is running, open [http://localhost:8000](http://localhost:8000) or check its [health status](http://localhost:8000/health)."
